# Dedicated PostgreSQL stack for the flow stats app. Independent of the
# gymie-postgres container (port 5432): this exposes 5433 on the host so the
# two never collide. It is its own stack, with the daemon under launchd,
# rather than a database inside gymie's, so neither stack's lifecycle can
# take the other down.
services:
  flow-postgres:
    image: postgres:18-alpine
    container_name: flow-postgres
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow
    ports:
      - "5433:5432"
    volumes:
      # postgres:18+ images store data in a version-specific subdirectory
      # under /var/lib/postgresql — mounting at .../data (the pre-18
      # convention) makes the entrypoint refuse to start. See
      # https://github.com/docker-library/postgres/pull/1259.
      - flow-pgdata:/var/lib/postgresql
volumes:
  flow-pgdata:
